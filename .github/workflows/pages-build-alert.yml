name: Pages build failure alert

# Fires on every GitHub Pages build (legacy `page_build` event covers both
# branch-based and Actions-based Pages deploys). If the build errored, send
# an email so we don't end up serving a stale prod build silently — which
# happened twice already (3832efe and 7fae0e4 both errored without surfacing).

on:
  page_build

jobs:
  alert-on-failure:
    if: ${{ github.event.build.error.message != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BUILD_SHA: ${{ github.event.build.commit }}
          BUILD_ERROR: ${{ github.event.build.error.message }}
          BUILD_PUSHER: ${{ github.event.build.pusher.login }}
          BUILD_CREATED: ${{ github.event.build.created_at }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::error::RESEND_API_KEY secret not set on this repo."
            exit 1
          fi
          short_sha="${BUILD_SHA:0:7}"
          subject="[Pages BUILD FAILED] haoyunlabs.com @ ${short_sha}"
          body=$(cat <<EOF
          <p><b>GitHub Pages build errored.</b> The live site is still serving the previous successful build, so check whether your latest change is missing in prod.</p>
          <ul>
            <li><b>Commit:</b> <code>${BUILD_SHA}</code></li>
            <li><b>Pushed by:</b> ${BUILD_PUSHER}</li>
            <li><b>When:</b> ${BUILD_CREATED}</li>
            <li><b>Error:</b> <code>${BUILD_ERROR}</code></li>
            <li><b>Build log:</b> <a href="https://github.com/${{ github.repository }}/actions">repo Actions tab</a></li>
          </ul>
          <p>Fix: push a no-op commit (e.g. update a comment) to re-trigger the build.</p>
          EOF
          )
          payload=$(jq -n \
            --arg subject "$subject" \
            --arg html "$body" \
            '{
              from: "Hao Yun Labs Alerts <alerts@haoyunlabs.com>",
              to: ["ryan@haoyunlabs.com"],
              reply_to: "ops@haoyunlabs.com",
              subject: $subject,
              html: $html,
              tags: [{name:"template",value:"pages-build-failed"}]
            }')
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"
